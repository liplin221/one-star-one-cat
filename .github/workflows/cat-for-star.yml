name: one-star-one-cat

on:
  schedule:
    # cron 用 UTC。整点是 GitHub Actions 的高峰期，定时任务可能被直接丢弃，
    # 所以整体偏移几分钟避开 :00，免费账号最短间隔 5 分钟。
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印不实际发送'
        type: boolean
        default: false
      max_per_run:
        description: '本轮最多送几只猫'
        type: string
        default: '20'
      redeliver:
        description: '点名再送一只猫（GitHub 用户名，多个用逗号分隔）'
        type: string
        default: ''

permissions:
  contents: write # 写回 README 猫咪墙和 seen 名单
  issues: write # 开 issue 送猫

concurrency:
  group: one-star-one-cat
  # 必须 false：并发两轮会互相覆盖 seen 名单，导致猫送重复或丢失
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Deliver cats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAX_PER_RUN: ${{ inputs.max_per_run || '20' }}
          FORCE_USERS: ${{ inputs.redeliver }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # 文生图可选。不配就自动用随机猫，功能不受影响
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
        run: node scripts/cat-for-star.mjs

      - name: Commit cats wall
        run: |
          git config user.name "cat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "没有新猫，跳过提交"
          else
            git commit -m "🐱 给新星标用户送猫"
            git push
          fi
