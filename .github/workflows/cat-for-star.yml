name: one-star-one-cat

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC，且高峰期可能延迟。免费账号最短间隔 5 分钟。
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印不实际发送'
        type: boolean
        default: false
      max_per_run:
        description: '本轮最多送几只猫'
        type: string
        default: '20'

permissions:
  contents: write # 写回 README 猫咪墙和 seen 名单
  issues: write # 开 issue 送猫

concurrency:
  group: one-star-one-cat
  # 必须 false：并发两轮会互相覆盖 seen 名单，导致猫送重复或丢失
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deliver cats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAX_PER_RUN: ${{ inputs.max_per_run || '20' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/cat-for-star.mjs

      - name: Commit cats wall
        run: |
          git config user.name "cat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_stargazers.json README.md
          if git diff --staged --quiet; then
            echo "没有新猫，跳过提交"
          else
            git commit -m "🐱 给新星标用户送猫"
            git push
          fi
