name: cat-on-demand

# 有人在 issue 里喊「I need another cat」就回他一只猫。
# 只监听 opened：机器人用 GITHUB_TOKEN 发的评论不会再触发 workflow，天然不会死循环。
on:
  issues:
    types: [opened]

permissions:
  contents: write # 落盘猫图、写冷却记录
  issues: write # 回复评论

concurrency:
  group: cat-on-demand
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Reply with a cat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          # 文生图可选。不配就自动用随机猫，功能不受影响
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
        run: node scripts/cat-for-star.mjs

      - name: Commit
        run: |
          git config user.name "cat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "没有新文件，跳过提交"
          else
            git commit -m "🐱 回应点名要猫"
            git push
          fi
